# pnpm 10 blocks dependency build scripts unless listed here. Prisma Client is
# generated by the project's own postinstall, so these are only needed for the
# native binaries: sharp backs next/image optimisation and unrs-resolver backs
# the eslint import resolver. @parcel/watcher ships prebuilt binaries and only
# serves jest's watch mode, so its fallback build stays off.
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true

# Patched versions of transitive dependencies the Prisma CLI still pins to
# vulnerable ranges. Drop each line once prisma's own range moves past it.
overrides:
  deepmerge-ts: ^8.0.0
  mysql2: ^3.22.0
