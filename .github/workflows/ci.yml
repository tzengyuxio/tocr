name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR makes the in-flight run irrelevant, but every
# commit on main should keep its own result -- merging twice in quick
# succession used to cancel the first merge's run and leave a gap.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # postinstall runs `prisma generate`, which needs no database connection.
      - run: pnpm install --frozen-lockfile

      # No --max-warnings yet: 34 warnings predate this workflow. Once they are
      # cleared, add `--max-warnings 0` so they cannot come back.
      - name: Lint
        run: pnpm exec eslint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test
